# Allow the project's .htaccess rules (clean 404s, sitemap.xml, blocked internal folders)
<Directory /var/www/html>
    AllowOverride All
</Directory>

# Uploaded images: never execute scripts there (uploads/ is a persistent volume, so its
# own .htaccess may be missing)
<Directory /var/www/html/uploads>
    php_admin_flag engine off
    <FilesMatch "\.(php|phtml|phar|pl|py|cgi)$">
        Require all denied
    </FilesMatch>
</Directory>

# RepoRun terminates HTTPS in Traefik: tell PHP the original request was HTTPS
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

ServerTokens Prod
ServerSignature Off
